name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Vet
        run: go vet -buildvcs=false ./...

      - name: Test
        run: go test -buildvcs=false ./...

      - name: Build
        run: go build -buildvcs=false ./...

      # The installers are shipped as-is: a parse error only shows up on a
      # user's machine, so parse every script here before release.
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              $failed = $true
              Write-Host ($file.FullName + ':' + $e.Extent.StartLineNumber + ': ' + $e.Message)
            }
          }
          if ($failed) { exit 1 }
