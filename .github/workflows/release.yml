name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve Codex compatibility version over HTTP
        shell: bash
        run: |
          CODEX_VERSION=$(go run -buildvcs=false ./cmd/update-codex-version)
          echo "CODEX_VERSION=$CODEX_VERSION" >> "$GITHUB_ENV"

      - name: Extract approved release notes from CHANGELOG.md
        shell: bash
        run: |
          go run -buildvcs=false ./cmd/release-notes extract "${GITHUB_REF_NAME#v}" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          # Pin the goreleaser major: the default 'latest' resolves to ~> v1,
          # which rejects the v2 config
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
